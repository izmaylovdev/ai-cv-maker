services:
  # Local Firestore, replacing the `postgres` and `admin-db` containers
  # (ADR-0021 decision #8). ONE emulator instance serves both cv-api and
  # admin-api, sharing a single database separated by top-level collection —
  # mirroring production, where the Firestore free tier covers exactly one
  # database per project.
  #
  # Contract (both the .NET and Node Firestore SDKs read these):
  #   FIRESTORE_EMULATOR_HOST  host:port of the emulator
  #   GOOGLE_CLOUD_PROJECT     project id namespacing the database
  #
  # The emulator is in-memory; scripts/firestore-emulator.sh adds the
  # export-on-shutdown / import-on-start round trip that makes firestore_data a
  # real replacement for the postgres volumes. See that script for why it is
  # needed rather than a plain `command:`.
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:580.0.0-emulators
    restart: unless-stopped
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-applysy-local}
      FIRESTORE_EMULATOR_BIND: 0.0.0.0:8085
      FIRESTORE_EMULATOR_DATA_DIR: /data/firestore-export
    entrypoint: ["bash", "/opt/firestore-emulator.sh"]
    volumes:
      - ./scripts/firestore-emulator.sh:/opt/firestore-emulator.sh:ro
      - firestore_data:/data
    ports:
      # Same port inside and out, so FIRESTORE_EMULATOR_HOST is firestore:8085
      # in-network and localhost:8085 for host-run dev servers (scripts/dev.sh).
      - "8085:8085"
    # The emulator serves plain HTTP 200 "Ok" on / once it is accepting traffic.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Compose's 10s default can cut the shutdown export short on a large local
    # dataset; the export is the only thing standing between a restart and an
    # empty database.
    stop_grace_period: 60s

  cv-api:
    build:
      context: .
      dockerfile: apps/cv-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Firestore replaces Cloud SQL (ADR-0021). Schemaless, so there is no
      # migration step here any more — ADR-0003's migrate-then-deploy job no
      # longer applies to cv-api.
      FIRESTORE_EMULATOR_HOST: firestore:8085
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-applysy-local}
      JwtSettings__Secret: ${JWT_SECRET}
      LlmService__GrpcUrl: http://llm-service:50051
      Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID}
      Google__ExtensionClientId: ${GOOGLE_EXTENSION_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Shared key admin-api uses to call /api/admin/* (ADR-0005).
      AdminApi__ApiKey: ${CV_API_ADMIN_KEY:-localdevkey}
      UsageLimit__MaxCostUsdPerUser: "2.00"
      # Distributed tracing to Tempo (ADR-0016). Unset => tracing is a no-op.
      OTEL_SERVICE_NAME: cv-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    ports:
      - "5050:8080"
    depends_on:
      firestore:
        condition: service_healthy
      llm-service:
        condition: service_started

  ui-angular:
    build:
      context: .
      dockerfile: apps/ui-angular/Dockerfile
    restart: unless-stopped
    environment:
      CV_API_UPSTREAM: http://cv-api:8080
      CHAT_UI_UPSTREAM: http://chat-ui:80
      PROFILE_BUILDER_UI_UPSTREAM: http://profile-builder-ui:80
      NGINX_ENVSUBST_TEMPLATE_VARS: CV_API_UPSTREAM CHAT_UI_UPSTREAM PROFILE_BUILDER_UI_UPSTREAM
    ports:
      - "4200:80"
    depends_on:
      - cv-api
      - chat-ui
      - profile-builder-ui

  chat-ui:
    build:
      context: .
      dockerfile: apps/chat-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "4202:80"

  profile-builder-ui:
    build:
      context: .
      dockerfile: apps/profile-builder-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "4203:80"

  # LLM_PROVIDER=openai + OPENAI_BASE_URL=http://host.docker.internal:1234/v1 targets LM Studio on the host.
  # LLM_PROVIDER=foundry + FOUNDRY_API_KEY + FOUNDRY_BASE_URL (or FOUNDRY_DEPLOYMENT_NAME) + LLM_MODEL (see .env.example).
  llm-service:
    build:
      context: .
      dockerfile: apps/llm-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_BASE_URL: ${FOUNDRY_BASE_URL:-}
      FOUNDRY_DEPLOYMENT_NAME: ${FOUNDRY_DEPLOYMENT_NAME:-}
      ANTHROPIC_FOUNDRY_MAX_TOKENS: ${ANTHROPIC_FOUNDRY_MAX_TOKENS:-8192}
      GRPC_PORT: "50051"
      # Prometheus scrapes llm-service:8000 (see monitoring/prometheus/prometheus.yml);
      # app default is 9090, so pin it to the published port.
      METRICS_PORT: "8000"
      # Distributed tracing to Tempo (ADR-0016). Unset => tracing is a no-op.
      OTEL_SERVICE_NAME: llm-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8000"
      - "50051:50051"

  admin-api:
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    restart: unless-stopped
    environment:
      # admin-api reads user data from cv-api, not the main DB (ADR-0005).
      CV_API_URL: http://cv-api:8080
      CV_API_ADMIN_KEY: ${CV_API_ADMIN_KEY:-localdevkey}
      # admin_users moved off its own Postgres onto the shared Firestore
      # database as a top-level `admin_users` collection (ADR-0021 decision #5).
      FIRESTORE_EMULATOR_HOST: firestore:8085
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-applysy-local}
      JWT_SECRET: ${ADMIN_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
    ports:
      - "3001:3000"
    depends_on:
      cv-api:
        condition: service_started
      firestore:
        condition: service_healthy

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
      args:
        GRAFANA_URL: http://localhost:3003
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin-api:3000
      GRAFANA_URL: http://localhost:3003
    ports:
      - "3002:3000"
    depends_on:
      - admin-api

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - cv-api
      - llm-service

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      # 3200 Tempo query API · 4317 OTLP gRPC · 4318 OTLP HTTP. Published so the
      # obs-dev overlay's host-run cv-api/llm-service can export to localhost.
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Explore (where trace-drilldown links open) requires Editor by default;
      # let the anonymous Viewer reach it so trace links don't bounce to login.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      TEMPO_URL: ${TEMPO_URL:-http://tempo:3200}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Host 3000 is reserved for the local admin-ui dev server; Grafana on 3003.
      - "3003:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  firestore_data:
  prometheus_data:
  grafana_data:
  tempo_data:
