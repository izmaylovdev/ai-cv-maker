syntax = "proto3";

package llm;

option csharp_namespace = "CvApi.Grpc";

service LlmService {
  rpc Generate (GenerateRequest) returns (GenerateResponse);
  rpc Optimize (OptimizeRequest) returns (OptimizeResponse);
  rpc ExtractProfile (ExtractProfileRequest) returns (ExtractProfileResponse);
  rpc EnhanceField (EnhanceFieldRequest) returns (EnhanceFieldResponse);
  rpc Chat (ChatRequest) returns (ChatResponse);
  rpc UserChat (UserChatRequest) returns (UserChatResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc GenerateCoverLetter (CoverLetterRequest) returns (CoverLetterResponse);
  rpc SelectBestProfile (SelectBestProfileRequest) returns (SelectBestProfileResponse);
}

// Canonical profile model (ADR-0013): a document of freely added/removed/reordered
// sections plus a fixed identity/contact header. Mirrors the TypeScript
// ProfileDocument in apps/profile-builder-ui/src/model.ts and the C#
// CvApi.Domain.Entities.ProfileDocument — keep the three in sync.
message ProfileHeaderProto {
  string full_name = 1;
  string title = 2;
  string email = 3;
  string phone = 4;
  string location = 5;
}

// One section item. `template` on the parent section discriminates which fields
// carry meaning: "timeline" items use title/dates/description; "list" items use text.
message SectionItemProto {
  string id = 1;
  string title = 2;
  string dates = 3;
  string description = 4;
  string text = 5;
}

// One generic section. `template` ∈ "free-form" (body) | "timeline" (items) | "list" (items).
message DocumentSectionProto {
  string id = 1;
  string template = 2;
  string heading = 3;
  string body = 4;
  repeated SectionItemProto items = 5;
}

message ProfileDocumentProto {
  // Optional id, carried alongside the document where the caller needs to map a
  // response back to a profile (cover letter / best-profile selection).
  string id = 1;
  ProfileHeaderProto header = 2;
  repeated DocumentSectionProto sections = 3;
}

message UsageMetadata {
  int32  prompt_tokens     = 1;
  int32  completion_tokens = 2;
  string model_name        = 3;
}

message GenerateRequest {
  ProfileDocumentProto profile = 1;
  string message = 2;
  string global_preferences = 3;
}

message GenerateResponse {
  ProfileDocumentProto document = 1;
  UsageMetadata usage = 2;
}

message OptimizeRequest {
  ProfileDocumentProto profile = 1;
  string message = 2;
  string global_preferences = 3;
}

message OptimizeResponse {
  ProfileDocumentProto document = 1;
  UsageMetadata usage = 2;
}

message ExtractProfileRequest {
  string cv_text = 1;
}

message ExtractProfileResponse {
  ProfileDocumentProto document = 1;
  UsageMetadata usage = 2;
}

message EnhanceFieldRequest {
  string content = 1;
  string field_purpose = 2;
}

message EnhanceFieldResponse {
  string enhanced = 1;
  UsageMetadata usage = 2;
}

message ChatMessage {
  string role    = 1;
  string content = 2;
}

message ChatRequest {
  ProfileDocumentProto profile = 1;
  string               message = 2;
  repeated ChatMessage history = 3;
}

message ChatProposal {
  string type        = 1;
  string description = 2;
  // JSON string describing a document patch.
  string patch_json  = 3;
}

message ChatResponse {
  string       reply    = 1;
  ChatProposal proposal = 2;
  UsageMetadata usage   = 3;
}

message ProfileSummary {
  string name     = 1;
  string title    = 2;
  string overview = 3;
  repeated string skills = 4;
}

message UserChatRequest {
  repeated ProfileSummary profiles = 1;
  string               message = 2;
  repeated ChatMessage history = 3;
  string global_preferences    = 4;
}

message UserChatResponse {
  string        reply              = 1;
  string        preferences_update = 2;
  UsageMetadata usage              = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message CoverLetterRequest {
  // Each profile carries its own id on the proto (ProfileDocumentProto.id).
  repeated ProfileDocumentProto profiles = 1;
  string job_title              = 2;
  string job_description        = 3;
  string field_context          = 4;
  string global_preferences     = 5;
}

message CoverLetterResponse {
  string        text               = 1;
  string        selected_profile_id = 2;
  UsageMetadata usage              = 3;
}

message SelectBestProfileRequest {
  repeated ProfileDocumentProto profiles = 1;
  string                job_description  = 2;
}

message SelectBestProfileResponse {
  string profile_id = 1;
}
