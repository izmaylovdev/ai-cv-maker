syntax = "proto3";

package llm;

option csharp_namespace = "CvApi.Grpc";

service LlmService {
  rpc Generate (GenerateRequest) returns (GenerateResponse);
  rpc ExtractProfile (ExtractProfileRequest) returns (ExtractProfileResponse);
  rpc Chat (ChatRequest) returns (ChatResponse);
  rpc UserChat (UserChatRequest) returns (UserChatResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc GenerateCoverLetter (CoverLetterRequest) returns (CoverLetterResponse);
  rpc SelectBestProfile (SelectBestProfileRequest) returns (SelectBestProfileResponse);
  rpc JobChat (JobChatRequest) returns (JobChatResponse);
}

// Canonical profile model (ADR-0014, amends ADR-0013): a fixed identity/contact
// header plus a `body` which is a recursive BlockNode tree. Mirrors the
// TypeScript BlockNode/ProfileDocument in apps/profile-builder-ui/src/model.ts
// and the C# CvApi.Domain.Entities.ProfileDocument / BlockNode — keep the three
// in sync.
message ProfileHeaderProto {
  string full_name = 1;
  string title = 2;
  string email = 3;
  string phone = 4;
  string location = 5;
}

// One node of the block tree. `type` is from the closed set (root, section,
// paragraph, text, list, listItem, chips, chip, timeline, entry). `attrs` carries
// type-specific leaf data (e.g. text.text, section.heading, entry.title/dates).
// `children` is ordered; array order IS document order. Recursive.
message ProfileNode {
  string type = 1;
  string id = 2;
  map<string, string> attrs = 3;
  repeated ProfileNode children = 4;
}

message ProfileDocumentProto {
  // Optional id, carried alongside the document where the caller needs to map a
  // response back to a profile (cover letter / best-profile selection).
  string id = 1;
  ProfileHeaderProto header = 2;
  ProfileNode body = 3;   // root node of the block tree
}

message UsageMetadata {
  int32  prompt_tokens     = 1;
  int32  completion_tokens = 2;
  string model_name        = 3;
}

message GenerateRequest {
  ProfileDocumentProto profile = 1;
  string message = 2;
  string global_preferences = 3;
}

message GenerateResponse {
  ProfileDocumentProto document = 1;
  UsageMetadata usage = 2;
}

message ExtractProfileRequest {
  string cv_text = 1;
}

message ExtractProfileResponse {
  ProfileDocumentProto document = 1;
  UsageMetadata usage = 2;
}

message ChatMessage {
  string role    = 1;
  string content = 2;
}

// US-AI-13 — one of the user's other saved profiles, passed down so the in-editor
// agent can read it on demand via the list_profiles / get_profile tools.
message OtherProfile {
  string               id       = 1;
  string               name     = 2;
  ProfileDocumentProto document = 3;
}

message ChatRequest {
  ProfileDocumentProto profile        = 1;
  string               message        = 2;
  repeated ChatMessage history        = 3;
  repeated OtherProfile other_profiles = 4;
}

message ChatProposal {
  string type        = 1;
  string description = 2;
  // JSON string describing a document patch (type "edit").
  string patch_json  = 3;
  // Plain text to fill into a page field (type "fill", US-EXT-4).
  string text        = 4;
}

message ChatResponse {
  string       reply    = 1;
  ChatProposal proposal = 2;
  UsageMetadata usage   = 3;
}

message ProfileSummary {
  string name     = 1;
  string title    = 2;
  string overview = 3;
  repeated string skills = 4;
}

message UserChatRequest {
  repeated ProfileSummary profiles = 1;
  string               message = 2;
  repeated ChatMessage history = 3;
  string global_preferences    = 4;
}

message UserChatResponse {
  string        reply              = 1;
  string        preferences_update = 2;
  UsageMetadata usage              = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message CoverLetterRequest {
  // Each profile carries its own id on the proto (ProfileDocumentProto.id).
  repeated ProfileDocumentProto profiles = 1;
  string job_title              = 2;
  string job_description        = 3;
  string field_context          = 4;
  string global_preferences     = 5;
}

message CoverLetterResponse {
  string        text               = 1;
  string        selected_profile_id = 2;
  UsageMetadata usage              = 3;
}

message SelectBestProfileRequest {
  repeated ProfileDocumentProto profiles = 1;
  string                job_description  = 2;
}

message SelectBestProfileResponse {
  string profile_id = 1;
}

// US-EXT-4 — side-panel chat about an open job posting. Profile summaries + the
// posting are context; the assistant can answer questions or return a "fill"
// proposal (a cover-letter draft) in ChatProposal.text.
message JobChatRequest {
  repeated ProfileSummary profiles = 1;
  string               job_title       = 2;
  string               job_description = 3;
  string               field_context   = 4;
  string               message         = 5;
  repeated ChatMessage history         = 6;
}

message JobChatResponse {
  string        reply    = 1;
  ChatProposal  proposal = 2;
  UsageMetadata usage    = 3;
}
