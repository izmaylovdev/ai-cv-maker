<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Builder Dev</title>
    <style>
      /* Harness page backdrop follows @applysy/theme's `dark` class on <html>. */
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #eef0f4;
        transition: background 0.15s ease;
      }
      html.dark body { background: #0e0f13; }
      applysy-profile-builder { display: block; }
    </style>
  </head>
  <body>
    <applysy-profile-builder id="builder"></applysy-profile-builder>

    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/dev-shell.ts"></script>

    <script type="module">
      import { SAMPLE_DOCUMENT } from '/src/sample.ts';

      customElements.whenDefined('applysy-profile-builder').then(() => {
        const el = document.getElementById('builder');
        // Seed via the property API.
        el.document = SAMPLE_DOCUMENT;
        // Observe edits emitted by the widget.
        el.addEventListener('documentchange', (e) => {
          console.log('[harness] documentchange', e.detail);
        });
      });
    </script>
  </body>
</html>
