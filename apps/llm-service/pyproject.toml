[project]
name = "llm-service"
version = "0.1.0"
description = "AI CV generation microservice exposing LLM operations over gRPC (grpc.aio) with LangChain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    # 2.x sends API version 2026-10-21, which rejects sampling parameters
    # (temperature/top_p/top_k) on every model. The contract tests in
    # app/test_anthropic_sdk_contract.py guard the call shape.
    "anthropic>=2.2.0,<3",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    # Must stay >= the gencode stamp in app/grpc/llm_service_pb2.py (which
    # `npm run grpc:generate` can move) and on the same major, or the stubs
    # fail to import. Enforced by app/test_protobuf_floor.py.
    "protobuf>=7.35.0,<8",
    "prometheus-client>=0.21.0",
    "langfuse>=3.0.0,<4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Distributed tracing to Tempo (ADR-0016).
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# importlib mode avoids inserting test dirs onto sys.path, which otherwise lets
# the local `app/grpc` package shadow the real `grpc` distribution (grpc.aio).
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
