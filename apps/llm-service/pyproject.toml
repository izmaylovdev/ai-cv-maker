[project]
name = "llm-service"
version = "0.1.0"
description = "AI CV generation microservice exposing LLM operations over gRPC (grpc.aio) with LangChain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "anthropic>=0.45.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "prometheus-client>=0.21.0",
    "langfuse>=3.0.0,<4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# importlib mode avoids inserting test dirs onto sys.path, which otherwise lets
# the local `app/grpc` package shadow the real `grpc` distribution (grpc.aio).
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
